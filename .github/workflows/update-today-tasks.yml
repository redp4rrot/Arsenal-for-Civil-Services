name: Update today's Scrum tasks
on:
  push:
    paths:
      - 'scripts/fetch_today_tasks.py'
      - '.github/workflows/update-today-tasks.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch today's project tasks
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python scripts/fetch_today_tasks.py
      - name: Publish task snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/today-tasks.json
          if git diff --cached --quiet; then
            echo "No task snapshot changes."
          else
            git commit -m "Update Scrum task snapshot"
            git push
          fi
