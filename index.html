<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arsenal for Civil Services</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <div class="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="header">

            <div
                class="breadcrumbs"
                id="breadcrumbs"
            ></div>

            <div class="header-row">

                <div>

                    <h1 id="title">
                        Arsenal for Civil Services
                    </h1>

                    <div
                        class="subtitle"
                        id="subtitle"
                    >
                        Repository root
                    </div>

                </div>

                <button
                    id="refresh-btn"
                    class="refresh-btn"
                    type="button"
                >
                    ↻ Refresh
                </button>

            </div>

        </header>


        <!-- =====================================================
             LIVE PRODUCTIVITY TRACKING
        ====================================================== -->

        <section
            id="productivity-dashboard"
            class="dashboard-section"
        >

            <!-- Section header -->

            <div class="section-header">

                <div class="section-title">

                    <span class="section-icon">
                        ⌁
                    </span>

                    <span>
                        LIVE TRACKING
                    </span>

                </div>

            </div>


            <!-- Tracking card -->

            <div class="tracking-card">

                <div class="tracking-top">

                    <div>

                        <div
                            class="tracking-month"
                            id="tracking-month"
                        >
                            Loading...
                        </div>

                        <div class="tracking-label">
                            Average working hours / day
                        </div>

                    </div>


                    <!-- Month navigation -->

                    <div class="month-navigation">

                        <button
                            id="previous-month"
                            class="month-btn"
                            type="button"
                            aria-label="Previous month"
                        >
                            ←
                        </button>

                        <button
                            id="next-month"
                            class="month-btn"
                            type="button"
                            aria-label="Next month"
                        >
                            →
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     TRACKING CONTENT
                ================================================== -->

                <div class="tracking-content">


                    <!-- Donut -->

                    <div class="donut-wrapper">

                        <div
                            id="donut"
                            class="donut below"
                        >

                            <div class="donut-center">

                                <div
                                    id="average-hours"
                                    class="average-hours"
                                >
                                    …
                                </div>

                                <div class="hours-label">
                                    hrs/day
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- Tracking stats -->

                    <div class="tracking-stats">

                        <div class="target-row">

                            <span class="target-symbol">
                                ✦
                            </span>

                            <span>
                                Target:
                            </span>

                            <strong>
                                8 hrs/day
                            </strong>

                        </div>


                        <div class="target-line"></div>


                        <div
                            id="status-badge"
                            class="status-badge"
                        >
                            Loading...
                        </div>

                    </div>


                    <!-- Motivation -->

                    <div class="motivation-card">

                        <div class="motivation-quote">
                            <span id="motivation-quote">
                                Loading...
                            </span>
                        </div>

                        <div class="motivation-divider"></div>

                        <div
                            id="motivation-message"
                            class="motivation-message"
                        >
                            Loading...
                        </div>

                        <div class="motivation-symbol">
                            ★
                        </div>

                    </div>

                </div>


                <!-- =================================================
                     TRACKING FOOTER
                ================================================== -->

                <div class="tracking-footer">

                    <span id="total-hours">
                        Loading...
                    </span>

                    <span class="footer-dot">
                        •
                    </span>

                    <span id="days-logged">
                        Loading...
                    </span>

                </div>

            </div>

        </section>


        <!-- =====================================================
             REPOSITORY BROWSER
        ====================================================== -->

        <section class="dashboard-section repository-section">

            <div class="repository-header">

                <div class="section-title">

                    <span class="section-icon">
                        ▱
                    </span>

                    <span>
                        BROWSE REPOSITORY
                    </span>

                </div>

                <div
                    class="repository-subtitle"
                    id="repository-subtitle"
                >
                    Repository root
                </div>

            </div>


            <div id="file-list">

                <div class="loading">
                    Loading repository...
                </div>

            </div>

        </section>

    </div>


    <!-- =========================================================
         APPLICATION
    ========================================================== -->

    <script
        type="module"
        src="dashboard.js"
    ></script>

</body>

</html>
